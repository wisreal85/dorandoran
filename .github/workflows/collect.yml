name: 수집하고 배포

on:
  schedule:
    - cron: "7,37 * * * *"   # 30분마다 (GitHub 사정에 따라 몇 분씩 늦을 수 있음)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt

      # 수집 내역(SQLite)은 캐시에 이어 붙인다 — 저장소 커밋 기록을 더럽히지 않기 위해
      - uses: actions/cache/restore@v4
        with:
          path: data/doran.db
          key: doran-db-${{ github.run_id }}
          restore-keys: doran-db-

      - name: 수집
        run: python -m app.collector
      # 오픈소스 번역 모델(약 600MB)은 고정 키로 따로 캐시한다
      - uses: actions/cache@v4
        with:
          path: models
          key: nllb-600m-ct2-int8-v1
      - name: 번역
        run: python -m app.translate
      - name: 정적 사이트 굽기
        run: python -m app.build _site
        env:
          DORAN_ADSENSE: ${{ vars.DORAN_ADSENSE }}   # 저장소 변수에 ca-pub-... 를 넣으면 광고가 켜진다

      - uses: actions/cache/save@v4
        with:
          path: data/doran.db
          key: doran-db-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
